# Secretos necesarios en GitHub → Settings → Secrets and variables → Actions:
#
#   FIREBASE_SERVICE_ACCOUNT_B64
#     Base64 del serviceAccountKey.json (Firebase Console → Configuración → Cuentas de servicio).
#     Generar con:
#       python -c "import base64; print(base64.b64encode(open('auth/serviceAccountKey.json','rb').read()).decode())"
#     O en PowerShell:
#       [Convert]::ToBase64String([IO.File]::ReadAllBytes('auth\serviceAccountKey.json'))
#
#   CLAVE_PRIVADA_PEM
#     Contenido completo de clave_privada.pem (incluir cabecera y pie BEGIN/END EC PRIVATE KEY).
#
# ADVERTENCIA DE SEGURIDAD:
#   Las credenciales Firebase quedan embebidas en el .exe via PyInstaller.
#   Asegúrate de que la cuenta de servicio tenga permisos mínimos (solo escritura en Firestore).

name: Build and Deploy Agente

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (obligatorio). Ej. v2.3.0 — se escribe en config y en el .exe. No dejes vacío.'
        required: true
        default: ''
      actualizar_firestore:
        description: 'Tras el release, actualizar config/agente_hw (+ espejo agente) con la URL del .exe. Desactivá si cargás la URL a mano.'
        type: choice
        options:
          - 'si'
          - 'no'
        default: 'si'

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar entrada de versión
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          V="${VERSION// /}"
          if [ -z "$V" ]; then
            echo "::error::Completá el campo 'version' del workflow (ej. v2.3.0)."
            exit 1
          fi
          if [ "$V" = "v1.0.0" ]; then
            echo "::warning::Estás publicando como v1.0.0. Si no es intencional, cancelá y poné la versión real."
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin pywin32 psutil requests wmi pyinstaller ecdsa

      - name: Decode Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          python -c '
          import os, base64, json
          s = os.environ.get("FIREBASE_SERVICE_ACCOUNT_B64", "").strip().replace("\n","").replace("\r","").replace(" ","")
          if not s:
              raise SystemExit("ERROR: Secret FIREBASE_SERVICE_ACCOUNT_B64 no configurado. Ver comentarios en el workflow.")
          raw = base64.b64decode(s).decode("utf-8")
          sa = json.loads(raw)  # Validar que es JSON válido
          print("project_id:     ", sa.get("project_id"))
          print("client_email:   ", sa.get("client_email"))
          print("private_key_id: ", sa.get("private_key_id"))
          print("type:           ", sa.get("type"))
          os.makedirs("auth", exist_ok=True)
          # Escribir en modo binario para evitar conversión CRLF en Windows
          clean = json.dumps(sa, ensure_ascii=False).encode("utf-8")
          with open("auth/serviceAccountKey.json", "wb") as f:
              f.write(clean)
          print("auth/serviceAccountKey.json creado OK")
          '

      - name: Bump version in config.py
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PYEOF'
          import os, re
          version = os.environ["VERSION"].lstrip("v")
          path = "config/config.py"
          content = open(path).read()
          content = re.sub(r'VERSION\s*=\s*"[^"]*"', f'VERSION = "{version}"', content)
          open(path, "w").write(content)
          print("VERSION actualizada a", version)
          PYEOF

      - name: Commit version bump back to repo
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/config.py
          git diff --cached --quiet && echo "Sin cambios en config.py" && exit 0
          git commit -m "Bump VERSION to ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build AgenteBacar.exe
        run: pyinstaller AgenteBacar.spec --clean

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: AgenteBacar ${{ github.event.inputs.version }}
          files: dist/AgenteBacar.exe
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job independiente en Ubuntu: descarga el exe publicado, lo firma con ECDSA y actualiza Firestore.
  update-firestore:
    if: ${{ github.event.inputs.actualizar_firestore == 'si' }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Sign EXE and update Firestore config/agente_hw
        env:
          VERSION: ${{ github.event.inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          CLAVE_PRIVADA_PEM: ${{ secrets.CLAVE_PRIVADA_PEM }}
        run: |
          pip install firebase-admin ecdsa -q
          python - <<'PYEOF'
          import os, base64, json, hashlib, time
          import urllib.request
          import firebase_admin
          from firebase_admin import credentials, firestore
          import ecdsa as ecdsa_lib

          # --- Credenciales Firebase ---
          s = os.environ.get("FIREBASE_SERVICE_ACCOUNT_B64", "").strip().replace("\n","").replace("\r","").replace(" ","")
          if not s:
              raise SystemExit("ERROR: Secret FIREBASE_SERVICE_ACCOUNT_B64 no configurado.")
          sa = json.loads(base64.b64decode(s).decode("utf-8"))

          # --- Clave privada ECDSA ---
          # GitHub a veces pasa secrets multilínea con \n escapados — normalizamos.
          pem = os.environ.get("CLAVE_PRIVADA_PEM", "").strip()
          if not pem:
              raise SystemExit("ERROR: Secret CLAVE_PRIVADA_PEM no configurado.")
          if "\\n" in pem:
              pem = pem.replace("\\n", "\n")
          if not pem.endswith("\n"):
              pem += "\n"

          version_tag = os.environ.get("VERSION", "").strip()
          version_plain = version_tag.lstrip("v") if version_tag else ""
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          url = f"https://github.com/{repo}/releases/download/{version_tag}/AgenteBacar.exe"

          # --- Descargar el exe desde el release (con reintentos) ---
          print(f"Descargando {url} ...")
          exe_data = None
          for intento in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      exe_data = r.read()
                  print(f"  Descargado OK ({len(exe_data):,} bytes)")
                  break
              except Exception as e:
                  print(f"  Intento {intento+1}/6 fallido: {e}")
                  if intento < 5:
                      time.sleep(10)
          if exe_data is None:
              raise SystemExit("ERROR: No se pudo descargar el exe desde el release de GitHub.")

          # --- Calcular SHA-256 ---
          sha256 = hashlib.sha256(exe_data).hexdigest()
          print(f"SHA-256: {sha256}")

          # --- Firmar con ECDSA ---
          try:
              sk = ecdsa_lib.SigningKey.from_pem(pem.encode("utf-8"))
          except Exception as e:
              # Fallback: reconstruir el PEM línea por línea por si el formato llegó roto
              print(f"from_pem directo fallo ({e}), reconstruyendo PEM...")
              lines = [l for l in pem.splitlines() if l.strip()]
              pem2 = "\n".join(lines) + "\n"
              sk = ecdsa_lib.SigningKey.from_pem(pem2.encode("utf-8"))
          firma_bytes = sk.sign(exe_data, hashfunc=hashlib.sha256)
          firma_b64 = base64.b64encode(firma_bytes).decode("utf-8")
          print(f"Firma: {firma_b64[:40]}...")

          # --- Actualizar Firestore ---
          cred = credentials.Certificate(sa)
          firebase_admin.initialize_app(cred)
          db = firestore.client()
          data_hw = {
              "url": url,
              "version": version_plain,
              "sha256": sha256,
              "firma": firma_b64,
          }
          db.collection("config").document("agente_hw").set(data_hw, merge=True)
          db.collection("config").document("agente").set({"url": url}, merge=True)
          print(f"Firestore config/agente_hw actualizado -> version={version_plain}")
          PYEOF
