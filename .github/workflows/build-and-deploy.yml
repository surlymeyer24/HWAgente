# Secret FIREBASE_SERVICE_ACCOUNT_B64 = base64 del serviceAccountKey.json (para actualizar Firestore)
# Crear: python -c "import base64; print(base64.b64encode(open('auth/serviceAccountKey.json','rb').read()).decode())"
name: Build and Deploy Agente

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. v2.1.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin pywin32 psutil requests wmi pyinstaller

      - name: Create auth folder for build
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          python -c '
          import os, base64, json
          s = os.environ.get("FIREBASE_SERVICE_ACCOUNT_B64")
          if not s:
              raise SystemExit("ERROR: Secret FIREBASE_SERVICE_ACCOUNT_B64 no configurado. Ver docs en el workflow.")
          s = s.strip().replace("\n", "").replace("\r", "").replace(" ", "")
          raw = base64.b64decode(s).decode("utf-8")
          json.loads(raw)
          os.makedirs("auth", exist_ok=True)
          with open("auth/serviceAccountKey.json", "w") as f:
              f.write(raw)
          print("auth/serviceAccountKey.json creado OK")
          '

      - name: Build AgenteBacar.exe
        run: pyinstaller AgenteBacar.spec --clean

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: dist/AgenteBacar.exe
          generate_release_notes: true
          replace_existing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Firestore config/agente.url
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          VERSION: ${{ github.event.inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYEOF'
          import os, base64, json, firebase_admin
          from firebase_admin import credentials, firestore

          s = os.environ.get("FIREBASE_SERVICE_ACCOUNT_B64")
          if not s:
              raise SystemExit("ERROR: Secret FIREBASE_SERVICE_ACCOUNT_B64 no configurado.")
          s = s.strip().replace("\n", "").replace("\r", "").replace(" ", "")
          sa = json.loads(base64.b64decode(s).decode("utf-8"))

          version = os.environ.get("VERSION", "v1.0.0")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          url = f"https://github.com/{repo}/releases/download/{version}/AgenteBacar.exe"

          cred = credentials.Certificate(sa)
          firebase_admin.initialize_app(cred)
          db = firestore.client()
          db.collection("config").document("agente").set({"url": url}, merge=True)
          print("Firestore actualizado:", url)
          PYEOF
