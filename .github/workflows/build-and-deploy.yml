# Secret FIREBASE_SERVICE_ACCOUNT_B64 = base64 del JSON
# Crear: python -c "import base64; print(base64.b64encode(open('auth/serviceAccountKey.json','rb').read()).decode())"
name: Build and Deploy Agente

on:
  workflow_dispatch:   # Solo cuando vos lo ejecutás desde GitHub

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin google-cloud-storage pywin32 psutil requests wmi pyinstaller

      - name: Create auth folder for build
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          python -c '
          import os, base64, json
          s = os.environ.get("FIREBASE_SERVICE_ACCOUNT_B64")
          if not s:
              raise SystemExit("ERROR: Secret FIREBASE_SERVICE_ACCOUNT_B64 no configurado. Ver docs en el workflow.")
          raw = base64.b64decode(s).decode("utf-8")
          json.loads(raw)
          os.makedirs("auth", exist_ok=True)
          with open("auth/serviceAccountKey.json", "w") as f:
              f.write(raw)
          print("auth/serviceAccountKey.json creado OK")
          '

      - name: Build AgenteBacar.exe
        run: pyinstaller AgenteBacar.spec --clean

      - name: Upload to Firebase Storage and update Firestore
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          python - <<'PYEOF'
          import os, base64, json, firebase_admin
          from google.cloud import storage
          from firebase_admin import credentials, firestore

          raw = base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT_B64"]).decode("utf-8")
          sa = json.loads(raw)
          project_id = sa["project_id"]
          bucket_name = f"{project_id}.appspot.com"

          # Subir exe a Firebase Storage
          client = storage.Client.from_service_account_info(sa)
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("agente/AgenteBacar.exe")
          blob.upload_from_filename("dist/AgenteBacar.exe", content_type="application/octet-stream")
          url = f"https://firebasestorage.googleapis.com/v0/b/{bucket_name}/o/agente%2FAgenteBacar.exe?alt=media"
          print("Subido a Storage:", url)

          # Actualizar URL en Firestore
          cred = credentials.Certificate(sa)
          firebase_admin.initialize_app(cred)
          db = firestore.client()
          db.collection("config").document("agente").set({"url": url}, merge=True)
          print("Firestore actualizado: config/agente.url =", url)
          PYEOF
