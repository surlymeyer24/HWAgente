name: Monitor PCs Offline

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos
  workflow_dispatch:           # también se puede lanzar manualmente

jobs:
  check-offline:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Check offline PCs
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PYEOF'
          import os, json, firebase_admin
          from firebase_admin import credentials, firestore
          from datetime import datetime, timezone, timedelta

          UMBRAL_MINUTOS = 15   # PC sin sync por más de esto → OFFLINE

          sa = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          cred = credentials.Certificate(sa)
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          ahora = datetime.now(timezone.utc)
          umbral = ahora - timedelta(minutes=UMBRAL_MINUTOS)

          pcs = db.collection("computadoras").stream()
          offline_count = 0
          online_count = 0

          for doc in pcs:
              data = doc.to_dict() or {}
              ultima = data.get("ultima_sincronizacion")

              if ultima is None:
                  continue

              # Firestore devuelve DatetimeWithNanoseconds (ya tiene tzinfo)
              if hasattr(ultima, "tzinfo") and ultima.tzinfo is None:
                  ultima = ultima.replace(tzinfo=timezone.utc)

              estado_actual = data.get("estado_conexion", "ONLINE")

              if ultima < umbral:
                  if estado_actual != "OFFLINE":
                      db.collection("computadoras").document(doc.id).update({
                          "estado_conexion": "OFFLINE",
                          "ultima_vez_offline": firestore.SERVER_TIMESTAMP,
                      })
                      minutos_sin_sync = int((ahora - ultima).total_seconds() / 60)
                      hostname = data.get("hostname", doc.id)
                      print(f"[OFFLINE] {hostname} — sin sync hace {minutos_sin_sync} min")
                  offline_count += 1
              else:
                  if estado_actual == "OFFLINE":
                      db.collection("computadoras").document(doc.id).update({
                          "estado_conexion": "ONLINE",
                      })
                      hostname = data.get("hostname", doc.id)
                      print(f"[RECONECTADA] {hostname}")
                  online_count += 1

          print(f"\nResumen: {online_count} online, {offline_count} offline")
          PYEOF
